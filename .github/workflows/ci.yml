name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-integrations:
    name: Discover integrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integration_ids: ${{ steps.discover.outputs.integration_ids }}
      first_integration_id: ${{ steps.discover.outputs.first_integration_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Discover integrations
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          integration_ids=()
          for pyproject_path in integrations/*/pyproject.toml; do
            if ! test -f "${pyproject_path}"; then
              continue
            fi
            integration_id="${pyproject_path#integrations/}"
            integration_id="${integration_id%/pyproject.toml}"
            if [[ ! "${integration_id}" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]]; then
              echo "Invalid integration directory: ${integration_id}" >&2
              exit 1
            fi
            integration_ids+=("${integration_id}")
            if ! test -f "resources/${integration_id}.yml"; then
              echo "Missing resource for integration: ${integration_id}" >&2
              exit 1
            fi
          done

          if (( ${#integration_ids[@]} == 0 )); then
            echo "No integrations found" >&2
            exit 1
          fi

          for resource_path in resources/*.yml; do
            integration_id="${resource_path#resources/}"
            integration_id="${integration_id%.yml}"
            if ! test -f "integrations/${integration_id}/pyproject.toml"; then
              echo "Orphan integration resource: ${integration_id}" >&2
              exit 1
            fi
          done

          integration_ids_json="["
          separator=""
          for integration_id in "${integration_ids[@]}"; do
            integration_ids_json+="${separator}\"${integration_id}\""
            separator=","
          done
          integration_ids_json+="]"
          echo "integration_ids=${integration_ids_json}" >> "${GITHUB_OUTPUT}"
          echo "first_integration_id=${integration_ids[0]}" >> "${GITHUB_OUTPUT}"

  verify-integration:
    name: Verify ${{ matrix.integration_id }}
    needs: discover-integrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        integration_id: ${{ fromJSON(needs.discover-integrations.outputs.integration_ids) }}
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Verify integration
        run: ./scripts/check-integration.sh "${{ matrix.integration_id }}"
      - name: Smoke-test scaffolding
        if: matrix.integration_id == needs.discover-integrations.outputs.first_integration_id
        run: |
          smoke_id="class-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_module="lakeflow_${smoke_id//-/_}"
          smoke_function="integration_${smoke_id//-/_}"
          ./scripts/new-integration.sh "${smoke_id}" "CI Smoke"
          grep -Fq "def ${smoke_function}()" "integrations/${smoke_id}/src/${smoke_module}/integration.py"
          grep -Fq "main: ${smoke_module}.integration.${smoke_function}" "resources/${smoke_id}.yml"
          grep -Fq 'https://pypi.org/simple' "integrations/${smoke_id}/uv.lock"
          if grep -Fq 'pypi-proxy.cloud.databricks.com' "integrations/${smoke_id}/uv.lock"; then
            echo "Scaffolded lockfile contains an internal package URL" >&2
            exit 1
          fi
          if ./scripts/new-integration.sh "${smoke_id}" Duplicate; then
            echo "Scaffolder overwrote an existing integration" >&2
            exit 1
          fi
          if ./scripts/new-integration.sh 123 Numeric; then
            echo "Scaffolder accepted an invalid integration ID" >&2
            exit 1
          fi
      - name: Upload catalog artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-${{ matrix.integration_id }}-${{ github.sha }}
          path: build/catalog
          if-no-files-found: error
          retention-days: 1

  publish-artifacts:
    name: Publish artifacts
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-integration
    permissions:
      contents: write
    concurrency:
      group: publish-artifacts
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download catalog artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: catalog-*-${{ github.sha }}
          path: ${{ runner.temp }}/catalog
          merge-multiple: true
      - name: Publish artifacts
        run: ./scripts/publish-artifacts.sh "${RUNNER_TEMP}/catalog" "${GITHUB_SHA}"
