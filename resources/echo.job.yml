resources:
  jobs:
    echo_integration_test:
      name: "[example] Echo integration"
      tasks:
        - task_key: echo
          environment_key: echo_environment
          python_operator_task:
            main: lakeflow_echo.integration.echo
            parameters:
              - name: message
                value: "Hello from Lakeflow Integrations"
              - name: repeat_count
                value: "3"
      environments:
        - environment_key: echo_environment
          spec:
            environment_version: "5"
            dependencies:
              - ../integrations/echo/dist/*.whl
